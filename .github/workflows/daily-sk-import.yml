name: CarPrice Slovakia import
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Full catalogue or daily refresh (both resume unfinished work)
        required: false
        default: full
        type: choice
        options: [full, daily]
permissions:
  contents: write
  actions: write
concurrency:
  group: carprice-sk-database
  cancel-in-progress: false
jobs:
  update-sk:
    if: github.repository == 'Fojtik82/autoscan-pricing-backend' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/slovakia-backend
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund --package-lock=false
      - name: Resume all Slovak cars, motorcycles and commercial vehicles with equipment
        id: import
        env:
          CARPRICE_MARKET: SK
          SK_RUN_MINUTES: '210'
          SK_REFRESH_COMPLETED: ${{ github.event_name == 'schedule' && '1' || inputs.mode == 'daily' && '1' || '0' }}
        run: npm run cloud:full:sk
      - name: Publish only SK database and import progress
        run: |
          git config user.name 'CarPrice SK DB Bot'
          git config user.email 'carprice-sk-db-bot@users.noreply.github.com'
          git add -A -- 'data/vehicles_sk.db.gz*' data/sk-import-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint Slovakia full vehicle import'
            git pull --rebase origin codex/slovakia-backend
            git push origin HEAD:codex/slovakia-backend
          fi
      - name: Continue unfinished catalogue automatically
        if: steps.import.outputs.complete == 'false' && steps.import.outputs.blocked == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily-sk-import.yml --repo Fojtik82/autoscan-pricing-backend --ref main -f mode=full
      - name: Report source access failure after saving progress
        if: steps.import.outputs.blocked == 'true'
        run: |
          cat data/sk-import-status.json
          echo 'Import checkpoint saved; a source needs retry. No catalogue completeness claimed.' >&2
          exit 1
